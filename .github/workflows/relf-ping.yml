name: Supabase keep-alive

on:
  schedule:
    - cron: '17 1,9,17 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-database:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Consultar endpoint público do ranking
        env:
          SUPABASE_URL: https://ypqmkodewdpuqmsmkdzm.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_cbs98m2QqLJRUMzBrkaOPw_MS6Vu8ym
        run: |
          curl --fail --silent --show-error --max-time 30 \
            --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            "${SUPABASE_URL}/rest/v1/leaderboard_entries?select=id&limit=1" \
            --output /dev/null
