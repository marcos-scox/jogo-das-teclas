<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10121a">
  <title>Supabase keep-alive · Toque Certo</title>
  <style>
    :root{color-scheme:dark;--bg:#090D1B;--panel:#11182A;--line:#25314A;--ink:#F3F5FF;--muted:#9AA7C2;--accent:#B8A6FF;--good:#55D6AF;--bad:#FF788E;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,#1c2140,var(--bg) 60%);color:var(--ink)}
    main{width:min(100%,560px);padding:28px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 70px #0007}
    .eyebrow{color:var(--accent);font-size:.76rem;font-weight:700;letter-spacing:.13em}h1{margin:8px 0 10px;font-size:clamp(1.6rem,6vw,2.25rem)}p{color:var(--muted);line-height:1.6}
    #status{margin:22px 0 8px;padding:14px;border:1px solid var(--line);border-radius:10px;background:#0b1120;color:var(--muted)}#status.ok{color:var(--good)}#status.error{color:var(--bad)}
    button{padding:10px 15px;border:0;border-radius:9px;background:var(--accent);color:#17132b;font:700 1rem inherit;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.note{margin-top:22px;font-size:.84rem}
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">TOQUE CERTO · SUPABASE</span>
    <h1>Verificação do banco</h1>
    <p>Esta página faz uma consulta somente de leitura ao ranking para confirmar que o banco está respondendo.</p>
    <div id="status" role="status" aria-live="polite">Conectando ao banco…</div>
    <button id="ping" type="button">Testar novamente</button>
    <p class="note">O ping automático é executado pelo GitHub Actions. Esta página serve para verificar a conexão manualmente.</p>
  </main>
  <script>
    const projectUrl = 'https://ypqmkodewdpuqmsmkdzm.supabase.co';
    const publishableKey = 'sb_publishable_cbs98m2QqLJRUMzBrkaOPw_MS6Vu8ym';
    const status = document.querySelector('#status');
    const button = document.querySelector('#ping');
    async function ping(){
      button.disabled = true;
      status.className = '';
      status.textContent = 'Consultando o banco…';
      try{
        const response = await fetch(projectUrl + '/rest/v1/leaderboard_entries?select=id&limit=1', {
          headers: { apikey: publishableKey },
          cache: 'no-store'
        });
        if(!response.ok) throw new Error('Resposta HTTP ' + response.status);
        await response.json();
        status.className = 'ok';
        status.textContent = 'Banco respondeu com sucesso · ' + new Date().toLocaleString('pt-BR');
      }catch(error){
        status.className = 'error';
        status.textContent = 'Não foi possível consultar o banco: ' + error.message;
      }finally{
        button.disabled = false;
      }
    }
    button.addEventListener('click', ping);
    ping();
  </script>
</body>
</html>
